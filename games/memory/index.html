<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Memory Matrix — GAMEVERSE</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Poppins:wght@400;600&display=swap');
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      background: #0a0e1a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Poppins', sans-serif;
      color: #fff;
    }
    h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.3rem;
      background: linear-gradient(135deg, #8b5cf6, #06b6d4);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 12px;
    }
    .hud {
      display: flex; gap: 16px; margin-bottom: 16px;
    }
    .hud-item {
      text-align: center; padding: 8px 18px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 10px;
    }
    .hud-label { font-size:0.55rem; text-transform:uppercase; letter-spacing:2px; color:#6b7280; }
    .hud-value {
      font-family: 'Orbitron', sans-serif; font-size:1.1rem; font-weight:700;
      background: linear-gradient(135deg, #8b5cf6, #06b6d4);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .board {
      display: grid;
      grid-template-columns: repeat(4, 85px);
      grid-template-rows: repeat(4, 85px);
      gap: 8px;
      margin-bottom: 20px;
    }
    .card {
      width: 85px; height: 85px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      cursor: pointer;
      transition: all 0.35s ease;
      user-select: none;
    }
    .card:hover:not(.matched):not(.flipped) {
      background: rgba(139,92,246,0.08);
      border-color: rgba(139,92,246,0.3);
      transform: scale(1.05);
    }
    .card .card-inner {
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    .card.flipped {
      background: rgba(139,92,246,0.12);
      border-color: rgba(139,92,246,0.4);
      box-shadow: 0 0 15px rgba(139,92,246,0.2);
    }
    .card.flipped .card-inner { opacity: 1; }
    .card.matched {
      background: rgba(16,185,129,0.12);
      border-color: rgba(16,185,129,0.4);
      box-shadow: 0 0 15px rgba(16,185,129,0.2);
      cursor: default;
    }
    .card.matched .card-inner { opacity: 1; }
    .win-msg {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.1rem;
      color: #10b981;
      margin-bottom: 16px;
      min-height: 30px;
    }
    button {
      padding: 10px 28px;
      font-family: 'Orbitron', sans-serif; font-size:0.7rem; font-weight:700;
      letter-spacing:2px; text-transform:uppercase; color:#fff;
      background: linear-gradient(135deg, #8b5cf6, #06b6d4);
      border:none; border-radius:50px; cursor:pointer;
      transition: all 0.3s ease;
    }
    button:hover { transform:translateY(-2px); box-shadow:0 8px 25px rgba(139,92,246,0.5); }
  </style>
</head>
<body>
  <h1>🧠 MEMORY MATRIX</h1>
  <div class="hud">
    <div class="hud-item"><div class="hud-label">Moves</div><div class="hud-value" id="moves">0</div></div>
    <div class="hud-item"><div class="hud-label">Pairs</div><div class="hud-value" id="pairs">0/8</div></div>
    <div class="hud-item"><div class="hud-label">Time</div><div class="hud-value" id="timer">0:00</div></div>
  </div>
  <div class="win-msg" id="win-msg"></div>
  <div class="board" id="board"></div>
  <button onclick="initGame()">New Game</button>

  <script>
    const SYMBOLS = ['🎮','🕹️','👾','🏆','⚡','🔥','💎','🎯'];
    let cards, flipped, matched, moves, pairsFound, locked, timerInterval, startTime;

    function initGame() {
      clearInterval(timerInterval);
      const deck = [...SYMBOLS, ...SYMBOLS];
      // Shuffle
      for (let i = deck.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [deck[i], deck[j]] = [deck[j], deck[i]];
      }
      cards = deck;
      flipped = [];
      matched = new Set();
      moves = 0;
      pairsFound = 0;
      locked = false;
      startTime = Date.now();
      document.getElementById('moves').textContent = 0;
      document.getElementById('pairs').textContent = '0/8';
      document.getElementById('win-msg').textContent = '';
      document.getElementById('timer').textContent = '0:00';
      render();

      timerInterval = setInterval(() => {
        const elapsed = Math.floor((Date.now() - startTime) / 1000);
        const m = Math.floor(elapsed / 60);
        const s = (elapsed % 60).toString().padStart(2, '0');
        document.getElementById('timer').textContent = `${m}:${s}`;
      }, 1000);
    }

    function render() {
      const board = document.getElementById('board');
      board.innerHTML = '';
      cards.forEach((symbol, i) => {
        const card = document.createElement('div');
        card.className = 'card';
        if (flipped.includes(i)) card.classList.add('flipped');
        if (matched.has(i)) card.classList.add('matched');
        card.innerHTML = `<span class="card-inner">${symbol}</span>`;
        card.addEventListener('click', () => flipCard(i));
        board.appendChild(card);
      });
    }

    function flipCard(i) {
      if (locked || flipped.includes(i) || matched.has(i)) return;
      flipped.push(i);
      render();

      if (flipped.length === 2) {
        moves++;
        document.getElementById('moves').textContent = moves;
        locked = true;

        const [a, b] = flipped;
        if (cards[a] === cards[b]) {
          matched.add(a);
          matched.add(b);
          pairsFound++;
          document.getElementById('pairs').textContent = `${pairsFound}/8`;
          flipped = [];
          locked = false;
          render();

          if (pairsFound === 8) {
            clearInterval(timerInterval);
            const elapsed = Math.floor((Date.now() - startTime) / 1000);
            document.getElementById('win-msg').textContent = `🎉 You won in ${moves} moves and ${elapsed}s!`;
          }
        } else {
          setTimeout(() => {
            flipped = [];
            locked = false;
            render();
          }, 800);
        }
      }
    }

    initGame();
  </script>
</body>
</html>
