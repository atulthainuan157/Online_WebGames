<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2048 Fusion — GAMEVERSE</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Poppins:wght@400;600&display=swap');
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      background: #0a0e1a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Poppins', sans-serif;
      color: #fff;
      touch-action: none;
    }
    h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.4rem;
      background: linear-gradient(135deg, #8b5cf6, #06b6d4);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 12px;
    }
    .hud {
      display: flex;
      gap: 16px;
      margin-bottom: 16px;
    }
    .hud-item {
      text-align: center;
      padding: 8px 20px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 10px;
    }
    .hud-label { font-size:0.55rem; text-transform:uppercase; letter-spacing:2px; color:#6b7280; }
    .hud-value {
      font-family: 'Orbitron', sans-serif; font-size:1.1rem; font-weight:700;
      background: linear-gradient(135deg, #8b5cf6, #06b6d4);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(4, 80px);
      grid-template-rows: repeat(4, 80px);
      gap: 6px;
      padding: 10px;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 14px;
      margin-bottom: 16px;
    }
    .tile {
      width: 80px;
      height: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Orbitron', sans-serif;
      font-weight: 800;
      border-radius: 10px;
      transition: all 0.15s ease;
      user-select: none;
    }
    .tile-0 { background: rgba(255,255,255,0.03); }
    .tile-2 { background: rgba(139,92,246,0.15); color: #c4b5fd; font-size:1.3rem; border:1px solid rgba(139,92,246,0.2); }
    .tile-4 { background: rgba(139,92,246,0.25); color: #c4b5fd; font-size:1.3rem; border:1px solid rgba(139,92,246,0.3); }
    .tile-8 { background: rgba(6,182,212,0.3); color: #67e8f9; font-size:1.3rem; border:1px solid rgba(6,182,212,0.3); }
    .tile-16 { background: rgba(6,182,212,0.45); color: #22d3ee; font-size:1.2rem; border:1px solid rgba(6,182,212,0.4); }
    .tile-32 { background: rgba(236,72,153,0.35); color: #f9a8d4; font-size:1.2rem; border:1px solid rgba(236,72,153,0.3); }
    .tile-64 { background: rgba(236,72,153,0.5); color: #ec4899; font-size:1.2rem; border:1px solid rgba(236,72,153,0.4); }
    .tile-128 { background: rgba(245,158,11,0.4); color: #fbbf24; font-size:1.1rem; border:1px solid rgba(245,158,11,0.4); text-shadow:0 0 10px rgba(245,158,11,0.5); }
    .tile-256 { background: rgba(245,158,11,0.55); color: #f59e0b; font-size:1.1rem; border:1px solid rgba(245,158,11,0.5); text-shadow:0 0 10px rgba(245,158,11,0.5); }
    .tile-512 { background: rgba(16,185,129,0.45); color: #34d399; font-size:1rem; border:1px solid rgba(16,185,129,0.4); text-shadow:0 0 15px rgba(16,185,129,0.5); }
    .tile-1024 { background: rgba(239,68,68,0.45); color: #f87171; font-size:0.9rem; border:1px solid rgba(239,68,68,0.4); text-shadow:0 0 15px rgba(239,68,68,0.5); }
    .tile-2048 { background: linear-gradient(135deg,#8b5cf6,#06b6d4); color:#fff; font-size:0.9rem; box-shadow:0 0 30px rgba(139,92,246,0.5); border:none; }
    .tile-super { background: linear-gradient(135deg,#ec4899,#f59e0b); color:#fff; font-size:0.8rem; box-shadow:0 0 30px rgba(236,72,153,0.5); border:none; }
    button {
      padding: 10px 28px;
      font-family: 'Orbitron', sans-serif; font-size:0.7rem; font-weight:700;
      letter-spacing:2px; text-transform:uppercase; color:#fff;
      background: linear-gradient(135deg, #8b5cf6, #06b6d4);
      border:none; border-radius:50px; cursor:pointer;
      transition: all 0.3s ease;
    }
    button:hover { transform:translateY(-2px); box-shadow:0 8px 25px rgba(139,92,246,0.5); }
    .hint { margin-top:12px; font-size:0.65rem; color:#4b5563; }
    .game-over-overlay {
      position: absolute;
      inset: 0;
      background: rgba(10,14,26,0.88);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      border-radius: 14px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s;
    }
    .game-over-overlay.active { opacity: 1; pointer-events: auto; }
    .game-over-overlay h2 {
      font-family: 'Orbitron', sans-serif;
      background: linear-gradient(135deg,#8b5cf6,#06b6d4);
      -webkit-background-clip:text; -webkit-text-fill-color:transparent;
    }
  </style>
</head>
<body>
  <h1>🔢 2048 FUSION</h1>
  <div class="hud">
    <div class="hud-item"><div class="hud-label">Score</div><div class="hud-value" id="score">0</div></div>
    <div class="hud-item"><div class="hud-label">Best</div><div class="hud-value" id="best">0</div></div>
  </div>

  <div style="position:relative">
    <div class="grid" id="grid"></div>
    <div class="game-over-overlay" id="game-over">
      <h2>GAME OVER</h2>
      <p style="color:#9ca3af;font-size:0.85rem" id="final-msg">Score: 0</p>
      <button onclick="initGame()">Try Again</button>
    </div>
  </div>

  <button onclick="initGame()" style="margin-top:4px">New Game</button>
  <p class="hint">Arrow Keys / WASD to slide tiles</p>

  <script>
    let grid, score, bestScore;
    bestScore = parseInt(localStorage.getItem('gv-2048-hs') || '0');
    document.getElementById('best').textContent = bestScore;

    function initGame() {
      grid = Array.from({length:4}, () => Array(4).fill(0));
      score = 0;
      document.getElementById('score').textContent = 0;
      document.getElementById('game-over').classList.remove('active');
      addRandom();
      addRandom();
      render();
    }

    function addRandom() {
      const empty = [];
      grid.forEach((row, r) => row.forEach((v, c) => { if (!v) empty.push([r,c]); }));
      if (!empty.length) return;
      const [r,c] = empty[Math.floor(Math.random() * empty.length)];
      grid[r][c] = Math.random() < 0.9 ? 2 : 4;
    }

    function render() {
      const el = document.getElementById('grid');
      el.innerHTML = '';
      grid.forEach(row => {
        row.forEach(val => {
          const tile = document.createElement('div');
          let cls = val <= 2048 ? `tile-${val}` : 'tile-super';
          if (val === 0) cls = 'tile-0';
          tile.className = `tile ${cls}`;
          tile.textContent = val || '';
          el.appendChild(tile);
        });
      });
    }

    function slide(row) {
      let arr = row.filter(v => v);
      let merged = [];
      for (let i = 0; i < arr.length; i++) {
        if (i + 1 < arr.length && arr[i] === arr[i+1]) {
          merged.push(arr[i] * 2);
          score += arr[i] * 2;
          i++;
        } else {
          merged.push(arr[i]);
        }
      }
      while (merged.length < 4) merged.push(0);
      return merged;
    }

    function move(dir) {
      let moved = false;
      const oldGrid = grid.map(r => [...r]);

      if (dir === 'left') {
        grid = grid.map(row => slide(row));
      } else if (dir === 'right') {
        grid = grid.map(row => slide([...row].reverse()).reverse());
      } else if (dir === 'up') {
        for (let c = 0; c < 4; c++) {
          const col = [grid[0][c], grid[1][c], grid[2][c], grid[3][c]];
          const slid = slide(col);
          for (let r = 0; r < 4; r++) grid[r][c] = slid[r];
        }
      } else if (dir === 'down') {
        for (let c = 0; c < 4; c++) {
          const col = [grid[3][c], grid[2][c], grid[1][c], grid[0][c]];
          const slid = slide(col);
          for (let r = 0; r < 4; r++) grid[3-r][c] = slid[r];
        }
      }

      // Check if changed
      for (let r = 0; r < 4; r++)
        for (let c = 0; c < 4; c++)
          if (grid[r][c] !== oldGrid[r][c]) moved = true;

      if (moved) {
        addRandom();
        document.getElementById('score').textContent = score;
        if (score > bestScore) {
          bestScore = score;
          localStorage.setItem('gv-2048-hs', bestScore);
          document.getElementById('best').textContent = bestScore;
        }
        render();
        if (isGameOver()) {
          document.getElementById('final-msg').textContent = `Score: ${score}`;
          document.getElementById('game-over').classList.add('active');
        }
      }
    }

    function isGameOver() {
      for (let r = 0; r < 4; r++)
        for (let c = 0; c < 4; c++) {
          if (grid[r][c] === 0) return false;
          if (c < 3 && grid[r][c] === grid[r][c+1]) return false;
          if (r < 3 && grid[r][c] === grid[r+1][c]) return false;
        }
      return true;
    }

    document.addEventListener('keydown', (e) => {
      const map = {
        ArrowLeft:'left', ArrowRight:'right', ArrowUp:'up', ArrowDown:'down',
        a:'left', d:'right', w:'up', s:'down'
      };
      if (map[e.key]) { e.preventDefault(); move(map[e.key]); }
    });

    // Touch support
    let touchStart = null;
    document.addEventListener('touchstart', (e) => {
      touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
    });
    document.addEventListener('touchend', (e) => {
      if (!touchStart) return;
      const dx = e.changedTouches[0].clientX - touchStart.x;
      const dy = e.changedTouches[0].clientY - touchStart.y;
      if (Math.abs(dx) > Math.abs(dy)) {
        move(dx > 0 ? 'right' : 'left');
      } else {
        move(dy > 0 ? 'down' : 'up');
      }
      touchStart = null;
    });

    initGame();
  </script>
</body>
</html>
