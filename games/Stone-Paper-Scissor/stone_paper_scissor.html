<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stone, Paper & Scissors Game </title>
    <link rel="stylesheet" href="stone_paper_scissor.css">
</head>
<body>
    <h1>Stone, Paper & Scissors </h1>

    <div class="choices">
        <div id="rock" class="choice">
            <img src="images/rock.png" alt="" srcset="">
        </div>
        <div id="paper" class="choice">
            <img src="images/paper.png" alt="" srcset="">
        </div>
        <div id="scissor" class="choice">
            <img src="images/scissors.jpg" alt="" srcset="">
        </div>
    </div>

    <div class="score-board">
        <div class="score">
            <p id="user-score">0</p>
            <p>You</p>
        </div>
        <div class="score">
            <p id="comp-score">0</p>
            <p>Computer</p>
        </div>
    </div>

    <div class="msg-container">
        <p id="msg">Play your move</p>
    </div>
    <script src="stone_paper_scissor.js"></script>
</body>
</html>
