<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Pacman - GameVerse</title><link rel="stylesheet" href="pacman.css"></head><body>
<a href="../../index.html" class="back-btn">← Back to Games</a>
<h1>ᗧ Pacman</h1>
<div class="score-board"><span>Score: <strong id="score">0</strong></span><span>Lives: <strong id="lives">3</strong></span></div>
<canvas id="gameCanvas" width="400" height="400"></canvas>
<div id="overlay"><p id="overlayText">Press Space or Tap to Start</p></div>
<div class="controls">
    <button onclick="changeDir('up')">▲</button>
    <div>
        <button onclick="changeDir('left')">◀</button>
        <button onclick="changeDir('down')">▼</button>
        <button onclick="changeDir('right')">▶</button>
    </div>
</div>
<script src="pacman.js"></script></body></html>
