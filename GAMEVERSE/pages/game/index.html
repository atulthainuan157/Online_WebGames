<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Play Game | GAMEVERSE</title>
    <link rel="stylesheet" href="../../css/global/reset.css">
    <link rel="stylesheet" href="../../css/global/variables.css">
    <link rel="stylesheet" href="../../css/global/typography.css">
    <link rel="stylesheet" href="../../css/global/animations.css">
    <link rel="stylesheet" href="../../css/global/global.css">
    <link rel="stylesheet" href="../../css/components/navbar.css">
    <link rel="stylesheet" href="../../css/components/sidebar.css">
    <style>
        .iframe-container {
            width: 100%;
            height: calc(100vh - 71px); /* minus navbar height */
            margin-top: 71px;
            border: none;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>
    <div class="app-wrapper">
        <header id="main-header"></header>
        <aside id="main-sidebar"></aside>

        <main class="iframe-container">
            <iframe id="game-frame" src="../../games/arcade/snake/index.html" title="Game Player"></iframe>
        </main>
    </div>

    <!-- Component JS -->
    <script src="../../js/components/navbar.js"></script>
    <script src="../../js/components/sidebar.js"></script>
    <!-- Core JS -->
    <script src="../../js/core/app.js"></script>
    <script>
        // Simple router logic to load the requested game
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const gameId = urlParams.get('id');
            const frame = document.getElementById('game-frame');
            
            const gameMap = {
                'snake': '../../games/arcade/snake/index.html',
                'tic-tac-toe': '../../games/board/tic-tac-toe/index.html',
                '2048': '../../games/puzzle/2048/index.html'
            };

            if (gameId && gameMap[gameId]) {
                frame.src = gameMap[gameId];
            }
        });
    </script>
</body>
</html>
