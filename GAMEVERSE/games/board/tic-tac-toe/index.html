<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe | GAMEVERSE</title>
    <link rel="stylesheet" href="../../../css/global/reset.css">
    <link rel="stylesheet" href="../../../css/global/variables.css">
    <link rel="stylesheet" href="../../../css/global/typography.css">
    <link rel="stylesheet" href="../../../css/global/global.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <div class="game-header">
            <h2>Neon Tic-Tac-Toe</h2>
            <div class="status-board" id="status">Player X's Turn</div>
        </div>
        <div class="board" id="board">
            <div class="cell" data-index="0"></div>
            <div class="cell" data-index="1"></div>
            <div class="cell" data-index="2"></div>
            <div class="cell" data-index="3"></div>
            <div class="cell" data-index="4"></div>
            <div class="cell" data-index="5"></div>
            <div class="cell" data-index="6"></div>
            <div class="cell" data-index="7"></div>
            <div class="cell" data-index="8"></div>
        </div>
        <div class="controls">
            <button id="reset-btn" class="hover-glow">Restart Game</button>
        </div>
        <a href="../../../index.html" class="back-link">← Back to GAMEVERSE</a>
    </div>

    <script src="script.js"></script>
</body>
</html>
