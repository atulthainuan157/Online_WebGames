<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake | GAMEVERSE</title>
    <!-- Use relative paths back to global styles -->
    <link rel="stylesheet" href="../../../css/global/reset.css">
    <link rel="stylesheet" href="../../../css/global/variables.css">
    <link rel="stylesheet" href="../../../css/global/typography.css">
    <link rel="stylesheet" href="../../../css/global/global.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <div class="game-header">
            <h2>Neon Snake</h2>
            <div class="score-board">
                Score: <span id="score">0</span> | High Score: <span id="high-score">0</span>
            </div>
        </div>
        <div class="canvas-wrapper">
            <canvas id="gameCanvas" width="400" height="400"></canvas>
            <div id="game-over-screen" class="hidden">
                <h3>Game Over!</h3>
                <p>Your Score: <span id="final-score">0</span></p>
                <button id="restart-btn" class="hover-glow">Play Again</button>
            </div>
            <div id="start-screen">
                <h3>Ready to Play?</h3>
                <p>Use Arrow Keys to move.</p>
                <button id="start-btn" class="hover-glow">Start Game</button>
            </div>
        </div>
        <a href="../../../index.html" class="back-link">← Back to GAMEVERSE</a>
    </div>

    <script src="script.js"></script>
</body>
</html>
