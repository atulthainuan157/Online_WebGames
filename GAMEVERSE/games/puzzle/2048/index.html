<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2048 | GAMEVERSE</title>
    <link rel="stylesheet" href="../../../css/global/reset.css">
    <link rel="stylesheet" href="../../../css/global/variables.css">
    <link rel="stylesheet" href="../../../css/global/typography.css">
    <link rel="stylesheet" href="../../../css/global/global.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <div class="game-header">
            <div class="title-section">
                <h2>Neon 2048</h2>
                <p>Join the numbers to get to the <strong>2048</strong> tile!</p>
            </div>
            <div class="scores-container">
                <div class="score-box">
                    <div class="score-label">SCORE</div>
                    <div id="score">0</div>
                </div>
                <div class="score-box">
                    <div class="score-label">BEST</div>
                    <div id="high-score">0</div>
                </div>
            </div>
        </div>
        
        <div class="controls">
            <button id="new-game-btn" class="hover-glow">New Game</button>
        </div>

        <div class="game-board-wrapper">
            <div id="game-message" class="hidden">
                <h3 id="message-text">Game Over!</h3>
                <button id="retry-btn" class="hover-glow">Try Again</button>
            </div>
            <div class="grid-container" id="grid">
                <!-- 16 grid cells will be generated by JS -->
            </div>
        </div>
        
        <a href="../../../index.html" class="back-link">← Back to GAMEVERSE</a>
    </div>

    <script src="script.js"></script>
</body>
</html>
