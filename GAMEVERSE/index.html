<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GAMEVERSE | Premium Web Gaming</title>
    <meta name="description" content="Discover and play the best HTML5 web games on Gameverse.">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@700;800&display=swap" rel="stylesheet">
    
    <!-- Global Styles -->
    <link rel="stylesheet" href="css/global/reset.css">
    <link rel="stylesheet" href="css/global/variables.css">
    <link rel="stylesheet" href="css/global/typography.css">
    <link rel="stylesheet" href="css/global/animations.css">
    <link rel="stylesheet" href="css/global/global.css">
    
    <!-- Component Styles -->
    <link rel="stylesheet" href="css/components/navbar.css">
    <link rel="stylesheet" href="css/components/sidebar.css">
</head>
<body>
    <div class="app-wrapper">
        <!-- Header / Navbar placeholder -->
        <header id="main-header" class="slide-up"></header>
        
        <!-- Sidebar placeholder -->
        <aside id="main-sidebar"></aside>

        <!-- Main Content -->
        <main class="container">
            <section class="hero fade-in text-center" style="margin-top: 150px;">
                <h1 style="font-size: 5rem; margin-bottom: 20px; letter-spacing: -2px;">
                    Welcome to <span style="color: var(--primary-color); text-shadow: var(--neon-glow);">GAMEVERSE</span>
                </h1>
                <p style="color: var(--text-secondary); font-size: 1.2rem;">
                    The ultimate destination for premium web-based gaming experiences.
                </p>
                <button class="hover-glow floating" style="margin-top: 50px; padding: 15px 40px; font-size: 1.2rem; background-color: var(--surface-color); color: var(--primary-color); border: 2px solid var(--primary-color); border-radius: 30px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px;">
                    Start Playing
                </button>
            </section>

            <section class="game-grid" style="margin-top: 80px; display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 30px; padding-bottom: 50px;">
                <!-- Snake Card -->
                <a href="pages/game/index.html?id=snake" class="card hover-glow" style="display: block; background-color: var(--surface-color); border: 1px solid rgba(0, 255, 204, 0.2); border-radius: 10px; padding: 20px; text-align: center; transition: all 0.3s ease;">
                    <div style="font-size: 3rem; margin-bottom: 15px;">🐍</div>
                    <h3 style="color: var(--primary-color); margin-bottom: 10px;">Neon Snake</h3>
                    <p style="color: var(--text-secondary); font-size: 0.9rem;">Classic arcade action.</p>
                </a>
                
                <!-- Tic Tac Toe Card -->
                <a href="pages/game/index.html?id=tic-tac-toe" class="card hover-glow" style="display: block; background-color: var(--surface-color); border: 1px solid rgba(0, 255, 204, 0.2); border-radius: 10px; padding: 20px; text-align: center; transition: all 0.3s ease;">
                    <div style="font-size: 3rem; margin-bottom: 15px;">❌</div>
                    <h3 style="color: var(--primary-color); margin-bottom: 10px;">Tic-Tac-Toe</h3>
                    <p style="color: var(--text-secondary); font-size: 0.9rem;">Beat your friend.</p>
                </a>
                
                <!-- 2048 Card -->
                <a href="pages/game/index.html?id=2048" class="card hover-glow" style="display: block; background-color: var(--surface-color); border: 1px solid rgba(0, 255, 204, 0.2); border-radius: 10px; padding: 20px; text-align: center; transition: all 0.3s ease;">
                    <div style="font-size: 3rem; margin-bottom: 15px;">🧩</div>
                    <h3 style="color: var(--primary-color); margin-bottom: 10px;">Neon 2048</h3>
                    <p style="color: var(--text-secondary); font-size: 0.9rem;">Slide & merge tiles.</p>
                </a>
            </section>
        </main>
    </div>

    <!-- Component JS -->
    <script src="js/components/navbar.js"></script>
    <script src="js/components/sidebar.js"></script>

    <!-- Core JS -->
    <script src="js/core/app.js"></script>
</body>
</html>
