<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Play Tic Tac Toe online for free on GameVerse. Classic X and O strategy game.">
    <title>Tic Tac Toe — GameVerse</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="tic_tac_toe.css">
</head>
<body>
    <!-- ===== TOP BAR ===== -->
    <header class="top-bar" id="top-bar">
        <a href="../easy_games.html" class="back-link" id="back-link">← Back</a>
        <h1>Tic Tac <span class="gradient-text">Toe</span></h1>
        <div class="spacer"></div>
    </header>

    <!-- ===== WINNER MESSAGE ===== -->
    <div class="msg-container hide" id="msg-container">
        <p id="msg">Winner</p>
    </div>

    <!-- ===== GAME BOARD ===== -->
    <main class="game-area" id="game-area">
        <div class="container">
            <div class="game">
                <button class="box" id="box-0"></button>
                <button class="box" id="box-1"></button>
                <button class="box" id="box-2"></button>
                <button class="box" id="box-3"></button>
                <button class="box" id="box-4"></button>
                <button class="box" id="box-5"></button>
                <button class="box" id="box-6"></button>
                <button class="box" id="box-7"></button>
                <button class="box" id="box-8"></button>
            </div>
        </div>

        <div class="controls" id="controls">
            <button id="resetBtn" class="btn-action">Reset Game</button>
            <button id="newGameBtn" class="btn-action btn-accent hide">New Game</button>
        </div>
    </main>

    <script src="tic_tac_toe.js"></script>
</body>
</html>
